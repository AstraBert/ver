[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
blake3 = "1.8"
redb = "4.2"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["alloc"] }
ignore = "0.4.25"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
futures-util = "0.3.34"
redis = { version = "1.7", features = ["tls-rustls"] }
