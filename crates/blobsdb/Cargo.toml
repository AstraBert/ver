[package]
name = "ver-blobsdb"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "Content-addressed blob storage for ver"
license = "MIT"

[lib]
name = "blobsdb"
path = "src/lib.rs"

[dependencies]
blake3 = { workspace = true }
fastcdc = { version = "5.0.0", features = ["tokio", "tokio-stream"] }
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
tokio = { workspace = true }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["io"] }
postcard = { workspace = true }
serde = { workspace = true }
async-compression = { version = "0.4.50", features = ["tokio", "zstd"] }

[dev-dependencies]
tempdir = "0.3.7"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait = "0.1"
futures = "0.3"
reqwest = "0.13"

[lints.clippy]
upper_case_acronyms = "allow"
too_many_arguments = "allow"
