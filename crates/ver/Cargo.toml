[package]
name = "ver-vcs"
version = "0.1.0-alpha"
edition = "2024"
readme = "README.md"
description = "An intuitive, easy-to-use and non git-like version control system."
license = "MIT"

[[bin]]
name = "ver"
path = "src/main.rs"

[lib]
name = "ver"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ignore = { workspace = true }
blake3 = { workspace = true }
postcard = { workspace = true }
redb = { workspace = true }
ver-blobsdb = { path = "../blobsdb", version = "0.1" }
clap = { version = "4.6.7", features = ["derive"] }
minus = { version = "5.8.0", optional = true, features = ["static_output"] }
chrono = "0.4.45"
dirs = "7.0.0"
fs_extra = "1.3.0"
diffy = "0.5.2"
pretty-hex = { version = "0.4.2", optional = true }
tokio = { workspace = true }
futures-util = { workspace = true }
age = { version = "0.12.1", features = ["armor"] }

[features]
default = ["minus"]
minus = ["dep:minus"]
pretty-hex = ["dep:pretty-hex"]

[dev-dependencies]
tempdir = "0.3.7"
serial_test = "3"
async-trait = "0.1"
futures = "0.3"
object_store = { version = "0.14", features = ["aws", "gcp", "azure"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints.clippy]
upper_case_acronyms = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
unnecessary_unwrap = "allow"
path_ends_with_ext = "allow"
