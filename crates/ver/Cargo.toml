[package]
name = "ver-vcs"
version = "0.1.0-alpha"
edition = "2024"
readme = "README.md"
description = "An intuitive, easy-to-use and non git-like version control system."
license = "MIT"

[[bin]]
name = "ver"
path = "src/main.rs"

[lib]
name = "ver"
path = "src/lib.rs"

[dependencies]
toml = "1.1.8"
ver-fs = { path = "../fs", version = "0.1" }
ver-kv = { path = "../kv", version = "0.1" }
serde = { workspace = true }
serde_json = { workspace = true }
dirs = "7.0.0"
redb = { workspace = true }
