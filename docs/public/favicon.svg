<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="branchLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="branchRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="trunk" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- rounded spring-meadow background -->
  <rect width="64" height="64" rx="14" fill="#fefce8"/>
  <rect width="64" height="64" rx="14" fill="#ecfccb" opacity="0.55"/>

  <!-- V made of two git branches merging into one trunk -->
  <g fill="none" stroke-linecap="round">
    <!-- left branch: blossom pink curving down into the merge -->
    <path d="M 16 9 C 16 22, 21 33, 29.5 42" stroke="url(#branchLeft)" stroke-width="5"/>
    <!-- right branch: sky blue curving down into the merge -->
    <path d="M 48 9 C 48 22, 43 33, 34.5 42" stroke="url(#branchRight)" stroke-width="5"/>
    <!-- trunk: merged branch running to the point of the V -->
    <path d="M 32 44 L 32 55" stroke="url(#trunk)" stroke-width="5"/>
  </g>

  <!-- commit nodes: branch tips -->
  <circle cx="16" cy="9" r="4.6" fill="#f472b6" stroke="#fefce8" stroke-width="1.6"/>
  <circle cx="48" cy="9" r="4.6" fill="#38bdf8" stroke="#fefce8" stroke-width="1.6"/>
  <!-- mid-branch commits -->
  <circle cx="20.5" cy="24" r="3.2" fill="#fb923c" stroke="#fefce8" stroke-width="1.4"/>
  <circle cx="43.5" cy="24" r="3.2" fill="#a78bfa" stroke="#fefce8" stroke-width="1.4"/>
  <!-- merge commit -->
  <circle cx="32" cy="44" r="5.2" fill="#84cc16" stroke="#fefce8" stroke-width="1.6"/>
  <!-- tip of the V -->
  <circle cx="32" cy="57" r="3.4" fill="#16a34a" stroke="#fefce8" stroke-width="1.4"/>

  <!-- tiny spring leaves sprouting at the merge -->
  <path d="M 32 38.5 q -4.5 -3.5 -8 -1 q 3.5 3.5 8 1 z" fill="#a3e635"/>
  <path d="M 32 38.5 q 4.5 -3.5 8 -1 q -3.5 3.5 -8 1 z" fill="#a3e635"/>
</svg>
