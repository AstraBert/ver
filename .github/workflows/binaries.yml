name: Binaries

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write # to upload release assets

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest # cross-compiled from Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve binary name
        id: bin
        shell: bash
        run: |
          name="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "ver-vcs") | .targets[] | select(.kind | index("bin")) | .name' \
            | head -n1)"
          if [[ -z "$name" ]]; then
            echo "No binary target found in ver-vcs" >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: cargo build --release --locked --package ver-vcs --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        env:
          BIN: ${{ steps.bin.outputs.name }}
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          stage="${BIN}-${TAG}-${TARGET}"
          mkdir "$stage"

          if [[ "$TARGET" == *windows* ]]; then
            cp "target/${TARGET}/release/${BIN}.exe" "$stage/"
          else
            cp "target/${TARGET}/release/${BIN}" "$stage/"
          fi
          [[ -f README.md ]] && cp README.md "$stage/"
          for f in LICENSE*; do [[ -f "$f" ]] && cp "$f" "$stage/"; done

          if [[ "$TARGET" == *windows* ]]; then
            asset="${stage}.zip"
            7z a "$asset" "$stage" > /dev/null
          else
            asset="${stage}.tar.gz"
            tar czf "$asset" "$stage"
          fi

          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          else
            shasum -a 256 "$asset" > "${asset}.sha256"
          fi

          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
