name: Release

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: ')"
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: write # to create the tag and GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # First line only, strip the "release: " prefix, trim whitespace
          first_line="${MSG%%$'\n'*}"
          version="${first_line#release: }"
          version="$(echo "$version" | xargs)"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$version'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate_version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Cargo.toml version matches
        shell: bash
        env:
          CRATE: ver-vcs
          EXPECTED: ${{ steps.version.outputs.crate_version }}
        run: |
          found="$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg name "$CRATE" '.packages[] | select(.name == $name) | .version')"
          if [[ -z "$found" ]]; then
            echo "Package '$CRATE' not found in workspace" >&2
            exit 1
          fi
          if [[ "$found" != "$EXPECTED" ]]; then
            echo "$CRATE version '$found' does not match release version '$EXPECTED'" >&2
            exit 1
          fi

      - name: Publish to crates.io
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}
        run: |
          total=0
          excludes=()

          while IFS=$'\t' read -r name version; do
            total=$((total + 1))
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -A "ci-release-workflow" \
              "https://crates.io/api/v1/crates/${name}/${version}")"

            case "$code" in
              200) echo "Skipping ${name}@${version} (already published)"
                   excludes+=(--exclude "$name") ;;
              404) echo "Will publish ${name}@${version}" ;;
              *)   echo "Unexpected HTTP ${code} checking ${name}@${version}" >&2
                   exit 1 ;;
            esac
          done < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.publish != []) | [.name, .version] | @tsv')

          if (( ${#excludes[@]} / 2 == total )); then
            echo "Everything is already published, nothing to do"
            exit 0
          fi

          cargo publish --workspace "${excludes[@]}"

      - name: Create tag and GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generateReleaseNotes: true

  binaries:
    name: Binaries
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.publish.outputs.version }}
