name: Release

on:
  push:
    branches: [main]

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: "startsWith(github.event.head_commit.message, 'release: ')"
    permissions:
      contents: write # to create the tag and GitHub release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          # First line only, strip the "release: " prefix, trim whitespace
          first_line="${MSG%%$'\n'*}"
          version="${first_line#release: }"
          version="$(echo "$version" | xargs)"

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: '$version'" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "crate_version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check Cargo.toml version matches
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.crate_version }}
        run: |
          found="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].version' | sort -u)"
          if [[ "$found" != "$EXPECTED" ]]; then
            echo "Cargo.toml version(s) '$found' do not match release version '$EXPECTED'" >&2
            exit 1
          fi

      - name: Publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_API_TOKEN }}

      - name: Create tag and GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          commit: ${{ github.sha }}
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generateReleaseNotes: true
